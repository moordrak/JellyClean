services:
  jellyclean:
    build: .
    image: jellyclean:latest
    container_name: jellyclean
    restart: unless-stopped
    ports:
      - "8095:8095"
    # Isti UID/GID kao Jellyfin / *arr (inače nema prava brisati)
    user: "1000:1000"
    environment:
      TZ: Europe/Zagreb
      # Oznaka=putanja unutar kontejnera, odvojeno zarezom
      MEDIA_PATHS: "Filmovi=/media/movies,Serije=/media/tv"
      # Jellyfin config/cache mape (samo za pregled, ne briše se iz njih)
      JELLYFIN_DIRS: "Config=/jellyfin/config,Cache=/jellyfin/cache"
      JELLYFIN_URL: "http://192.168.1.10:8096"
      JELLYFIN_API_KEY: "promijeni-me"
      # Ako Jellyfin vidi medije pod drugom putanjom: jellyfin_putanja=jellyclean_putanja
      PATH_MAP: "/data/movies=/media/movies;/data/tvshows=/media/tv"
      # JELLYFIN_USERS: "ivan,ana"     # koji korisnici se broje kod "pogledali svi"
      # Čišćenje Jellyfin config mape preko SSH-a (cache, slike, logovi, siročad u metadata)
      # JF_SSH_HOST: "192.168.1.20"
      # JF_SSH_USER: "root"
      # JF_SSH_KEY: "/data/ssh/id_ed25519"
      # JF_CONFIG_PATH: "/opt/jellyfin/config"
      ALLOW_DELETE: "true"
      TRASH_MODE: "true"
      TRASH_DAYS: "7"
      SCAN_INTERVAL_HOURS: "6"
      AUTH_USER: "admin"
      AUTH_PASS: "promijeni-me"
    volumes:
      - /mnt/nas/movies:/media/movies
      - /mnt/nas/tv:/media/tv
      - /opt/jellyfin/config:/jellyfin/config:ro
      - /opt/jellyfin/cache:/jellyfin/cache:ro
      - ./data:/data        # SSH ključ (data/ssh/id_ed25519) i known_hosts
